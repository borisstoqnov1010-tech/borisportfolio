<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>

    body{
      margin:0;
      background:#0f172a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .panel{
      background:#111827;
      padding:50px;
      border-radius:20px;
      text-align:center;

    }

      margin-bottom:20px;
    }

    button{
      margin-top:20px;
      padding:15px 25px;
      border:none;
      border-radius:10px;
      background:#38bdf8;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

  </style>
</head>
<body>

<div class="panel">

  <h1>ADMIN PANEL</h1>

  <p>Добре дошъл, Борис.</p>

  <button onclick="logout()">
    Назад
  </button>

</div>

<script>

function logout(){
  window.location.href = "index.html";
}

</script>

</body>
</html>
