<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#140019;
      color:white;
      padding:40px;
    }

    h1{
      color:#d946ef;
      margin-bottom:30px;
      text-align:center;
      font-size:42px;
    }

    .panel{
      max-width:800px;
      margin:auto;
      background:#1f0829;
      padding:40px;
      border-radius:25px;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
    }

    .box{
      margin-bottom:25px;
    }

    label{
      display:block;
      margin-bottom:10px;
      color:#d946ef;
      font-size:18px;
    }

    input,
    textarea{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#2a1036;
      color:white;
      font-size:16px;
    }

    textarea{
      min-height:120px;
      resize:none;
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:12px;
      background:#c026d3;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
    }

    button:hover{
      background:#d946ef;
    }

    .success{
      text-align:center;
      margin-top:20px;
      color:lightgreen;
      font-size:18px;
    }

    .projects-list{
      margin-top:35px;
    }

    .project-item{
      background:#2a1036;
      padding:20px;
      border-radius:15px;
      margin-bottom:15px;
    }

    .project-item h3{
      color:#d946ef;
      margin-bottom:10px;
    }

    .delete-btn{
      background:#dc2626;
      margin-top:15px;
      padding:12px;
      font-size:15px;
    }

    .delete-btn:hover{
      background:#ef4444;
    }

  </style>
</head>
<body>

<div class="panel">

  <h1>ADMIN PANEL</h1>

  <!-- NAME -->

  <div class="box">
    <label>Име</label>
    <input type="text" id="nameInput">
  </div>

  <!-- HERO -->

  <div class="box">
    <label>Hero Text</label>
    <textarea id="heroInput"></textarea>
  </div>

  <!-- ABOUT -->

  <div class="box">
    <label>About Text</label>
    <textarea id="aboutInput"></textarea>
  </div>

  <!-- MAIN PROJECT -->

  <div class="box">
    <label>Main Project</label>
    <textarea id="projectInput"></textarea>
  </div>

  <!-- NEW PROJECT -->

  <div class="box">
    <label>New Project Title</label>
    <input type="text" id="newProjectTitle">
  </div>

  <div class="box">
    <label>New Project Description</label>
    <textarea id="newProjectDescription"></textarea>
  </div>

  <button onclick="addProject()">
    Add Project
  </button>

  <button onclick="saveChanges()">
    Save Changes
  </button>

  <div class="success" id="successMessage"></div>

  <!-- PROJECTS -->

  <div class="projects-list" id="projectsList"></div>

</div>

<script>

  // LOAD OLD DATA

  document.getElementById("nameInput").value =
    localStorage.getItem("portfolioName") || "Борис";

  document.getElementById("heroInput").value =
    localStorage.getItem("portfolioHero") ||
    "Здрасти, аз съм начинаещ уча още python.";

  document.getElementById("aboutInput").value =
    localStorage.getItem("portfolioAbout") ||
    "Аз съм Борис.";

  document.getElementById("projectInput").value =
    localStorage.getItem("portfolioProject") ||
    "ChatGPT ми помогна.";

  // SAVE MAIN CONTENT

  function saveChanges(){

    localStorage.setItem(
      "portfolioName",
      document.getElementById("nameInput").value
    );

    localStorage.setItem(
      "portfolioHero",
      document.getElementById("heroInput").value
    );

    localStorage.setItem(
      "portfolioAbout",
      document.getElementById("aboutInput").value
    );

    localStorage.setItem(
      "portfolioProject",
      document.getElementById("projectInput").value
    );

    document.getElementById("successMessage").innerHTML =
      "Saved Successfully!";
  }

  // LOAD PROJECTS

  let projects =
    JSON.parse(localStorage.getItem("extraProjects")) || [];

  function renderProjects(){

    let list =
      document.getElementById("projectsList");

    list.innerHTML = "";

    projects.forEach((project,index) => {

      list.innerHTML += `
      
        <div class="project-item">

          <h3>${project.title}</h3>

          <p>${project.description}</p>

          <button
            class="delete-btn"
            onclick="deleteProject(${index})"
          >
            Delete
          </button>

        </div>

      `;

    });

  }

  renderProjects();

  // ADD PROJECT

  function addProject(){

    let title =
      document.getElementById("newProjectTitle").value;

    let description =
      document.getElementById("newProjectDescription").value;

    if(title === "" || description === ""){
      return;
    }

    projects.push({
      title:title,
      description:description
    });

    localStorage.setItem(
      "extraProjects",
      JSON.stringify(projects)
    );

    renderProjects();

    document.getElementById("newProjectTitle").value = "";
    document.getElementById("newProjectDescription").value = "";

    document.getElementById("successMessage").innerHTML =
      "Project Added!";
  }

  // DELETE PROJECT

  function deleteProject(index){

    projects.splice(index,1);

    localStorage.setItem(
      "extraProjects",
      JSON.stringify(projects)
    );

    renderProjects();

    document.getElementById("successMessage").innerHTML =
      "Project Deleted!";
  }

</script>

</body>
</html>
