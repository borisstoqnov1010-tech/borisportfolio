<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#140019;
      color:white;
      padding:40px;
    }

    h1{
      color:#d946ef;
      margin-bottom:30px;
      text-align:center;
    }

    .panel{
      max-width:700px;
      margin:auto;
      background:#1f0829;
      padding:40px;
      border-radius:20px;
    }

    .box{
      margin-bottom:25px;
    }

    label{
      display:block;
      margin-bottom:10px;
      color:#d946ef;
      font-size:18px;
    }

    input,
    textarea{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      background:#2a1036;
      color:white;
      font-size:16px;
    }

    textarea{
      min-height:120px;
      resize:none;
    }

    button{
      width:100%;
      padding:18px;
      border:none;
      border-radius:12px;
      background:#c026d3;
      color:white;
      font-size:18px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#d946ef;
    }

    .success{
      text-align:center;
      margin-top:20px;
      color:lightgreen;
    }

  </style>
</head>
<body>

<div class="panel">

  <h1>ADMIN PANEL</h1>

  <div class="box">
    <label>Име</label>
    <input type="text" id="nameInput">
  </div>

  <div class="box">
    <label>Hero Text</label>
    <textarea id="heroInput"></textarea>
  </div>

  <div class="box">
    <label>About Text</label>
    <textarea id="aboutInput"></textarea>
  </div>

  <div class="box">
    <label>Project</label>
    <textarea id="projectInput"></textarea>
  </div>

  <button onclick="saveChanges()">
    Save Changes
  </button>

  <div class="success" id="successMessage"></div>

</div>

<script>

  // LOAD OLD DATA

  document.getElementById("nameInput").value =
    localStorage.getItem("portfolioName") || "Борис";

  document.getElementById("heroInput").value =
    localStorage.getItem("portfolioHero") || "Здрасти, аз съм начинаещ уча още python.";

  document.getElementById("aboutInput").value =
    localStorage.getItem("portfolioAbout") || "Аз съм Борис.";

  document.getElementById("projectInput").value =
    localStorage.getItem("portfolioProject") || "ChatGPT ми помогна.";

  // SAVE

  function saveChanges(){

    localStorage.setItem(
      "portfolioName",
      document.getElementById("nameInput").value
    );

    localStorage.setItem(
      "portfolioHero",
      document.getElementById("heroInput").value
    );

    localStorage.setItem(
      "portfolioAbout",
      document.getElementById("aboutInput").value
    );

    localStorage.setItem(
      "portfolioProject",
      document.getElementById("projectInput").value
    );

    document.getElementById("successMessage").innerHTML =
      "Saved Successfully!";
  }

</script>

</body>
</html>
