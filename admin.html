<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>

  <style>

    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      text-align:center;
      padding-top:100px;
    }

    .panel{
      width:400px;
      margin:auto;
      background:#111827;
      padding:40px;
      border-radius:20px;
    }

    h1{
      color:#38bdf8;
    }

    button{
      margin-top:20px;
      padding:15px 25px;
      border:none;
      border-radius:10px;
      background:#38bdf8;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

  </style>
</head>
<body>

<div class="panel">

  <h1>ADMIN PANEL</h1>

  <p>Добре дошъл в admin panel-а.</p>

  <button onclick="logout()">
    Logout
  </button>

</div>

<script>

  function logout(){
    window.location.href = "index.html";
  }

</script>

</body>
</html>
