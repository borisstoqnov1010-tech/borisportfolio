<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>На Борис Portfolio</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
      scroll-behavior:smooth;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      width:100%;
      padding:20px 10%;
      display:flex;
      justify-content:space-between;
      align-items:center;
      position:fixed;
      top:0;
      background:rgba(15,23,42,0.9);
      backdrop-filter:blur(10px);
      z-index:1000;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#38bdf8;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin-left:20px;
    }

    nav a:hover{
      color:#38bdf8;
    }

    section{
      min-height:100vh;
      padding:120px 10%;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .hero h1{
      font-size:60px;
    }

    .hero span{
      color:#38bdf8;
    }

    .btn{
      margin-top:30px;
      width:200px;
      padding:15px;
      border:none;
      background:#38bdf8;
      color:white;
      border-radius:10px;
      cursor:pointer;
    }

    .about,
    .projects,
    .contact{
      background:#111827;
      border-radius:20px;
      padding:40px;
    }

    h2{
      font-size:40px;
      color:#38bdf8;
      margin-bottom:20px;
    }

    .projects-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
    }

    .project-card{
      background:#1e293b;
      padding:20px;
      border-radius:15px;
    }

    .contact input,
    .contact textarea{
      width:100%;
      padding:12px;
      margin-top:10px;
      background:#1e293b;
      border:none;
      border-radius:10px;
      color:white;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#020617;
    }

  </style>
</head>

<body>

<header>
  <div class="logo">Portfolio</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero" id="home">
  <h1>Здравей, аз съм <span>Борис</span></h1>
  <p>Начинаещ developer</p>

  <button class="btn" onclick="scrollToProjects()">
    Моите проекти
  </button>
</section>

<!-- ABOUT -->
<section id="about">
  <div class="about">
    <h2>About</h2>
    <p>Обичам Minecraft, Discord и web development.</p>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="projects">

    <h2>Projects</h2>

    <!-- IMPORTANT: id added -->
    <div class="projects-grid" id="projectsGrid">

      <div class="project-card">
        <h3>Base Project</h3>
        <p>Това е основният проект.</p>
      </div>

    </div>

  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="contact">
    <h2>Contact</h2>

    <input type="text" placeholder="Име">
    <input type="email" placeholder="Email">
    <textarea rows="5" placeholder="Съобщение"></textarea>
  </div>
</section>

<footer>
  © 2026 Portfolio
</footer>

<script>

function scrollToProjects(){
  document.getElementById("projects")
    .scrollIntoView({behavior:"smooth"});
}

/* LOAD EXTRA PROJECTS FROM LOCALSTORAGE */

let savedProjects =
  JSON.parse(localStorage.getItem("extraProjects")) || [];

let projectsGrid =
  document.getElementById("projectsGrid");

savedProjects.forEach(project => {

  let card = document.createElement("div");
  card.className = "project-card";

  card.innerHTML = `
    <h3>${project.title}</h3>
    <p>${project.description}</p>
  `;

  projectsGrid.appendChild(card);
});

</script>

</body>
</html>
