<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>На Борис Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">Portfolio</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
    <a href="inbox.html">Inbox</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero" id="home">
  <h1>Здравей, аз съм <span>Борис</span></h1>
  <p>Начинаещ developer</p>

  <button class="btn" onclick="scrollToProjects()">
    Моите проекти
  </button>
</section>

<!-- ABOUT -->
<section id="about">
  <div class="about">
    <h2>About</h2>
    <p>Обичам Minecraft, Discord и web development.</p>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="projects">

    <h2>Projects</h2>

    <div class="projects-grid" id="projectsGrid">
      <div class="project-card">
        <h3>Portfolio</h3>
        <p>С това portfolio ми помогна ChatGPT.</p>
      </div>
    </div>

  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="contact">
    <h2>Contact</h2>

    <input type="text" id="name" placeholder="Име">
    <input type="email" id="email" placeholder="Email">
    <textarea rows="5" id="message" placeholder="Съобщение"></textarea>

    <button class="btn" onclick="sendMessage()">
      Изпрати
    </button>

    <p id="status"></p>
  </div>
</section>

<footer>
  © 2026 Portfolio
</footer>

<script>

function scrollToProjects(){
  document.getElementById("projects")
    .scrollIntoView({behavior:"smooth"});
}

/* SEND MESSAGE */
function sendMessage(){

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let message = document.getElementById("message").value;
  let status = document.getElementById("status");

  if(name === "" || email === "" || message === ""){

    status.style.color = "red";
    status.innerText = "Попълни всички полета!";
    return;
  }

  let messages = JSON.parse(localStorage.getItem("messages")) || [];

  messages.push({
    name: name,
    email: email,
    message: message,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("messages", JSON.stringify(messages));

  status.style.color = "#38bdf8";
  status.innerText = "Съобщението е изпратено!";

  document.getElementById("name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("message").value = "";
}

/* LOAD PROJECTS */
let savedProjects =
  JSON.parse(localStorage.getItem("extraProjects")) || [];

let projectsGrid =
  document.getElementById("projectsGrid");

savedProjects.forEach(project => {

  let card = document.createElement("div");
  card.className = "project-card";

  card.innerHTML = `
    <h3>${project.title}</h3>
    <p>${project.description}</p>
  `;

  projectsGrid.appendChild(card);
});

</script>

</body>
</html>
