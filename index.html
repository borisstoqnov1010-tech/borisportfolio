<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>На Борис Portfolio</title>

  <!-- 🔥 ВАЖНО: връзка към CSS файла -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="logo">Portfolio</div>

  <nav>
    <a href="#home">Home</a>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero" id="home">
  <h1>Здравей, аз съм <span>Борис</span></h1>
  <p>Начинаещ developer</p>

  <button class="btn" onclick="scrollToProjects()">
    Моите проекти
  </button>
</section>

<!-- ABOUT -->
<section id="about">
  <div class="about">
    <h2>About</h2>
    <p>Обичам Minecraft, Discord и web development.</p>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="projects">

    <h2>Projects</h2>

    <div class="projects-grid" id="projectsGrid">
      <div class="project-card">
        <h3>Base Project</h3>
        <p>Това е основният проект.</p>
      </div>
    </div>

  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="contact">
    <h2>Contact</h2>

    <input type="text" placeholder="Име">
    <input type="email" placeholder="Email">
    <textarea rows="5" placeholder="Съобщение"></textarea>
  </div>
</section>

<footer>
  © 2026 Portfolio
</footer>

<script>
function scrollToProjects(){
  document.getElementById("projects")
    .scrollIntoView({behavior:"smooth"});
}

/* LOAD EXTRA PROJECTS */
let savedProjects =
  JSON.parse(localStorage.getItem("extraProjects")) || [];

let projectsGrid =
  document.getElementById("projectsGrid");

savedProjects.forEach(project => {
  let card = document.createElement("div");
  card.className = "project-card";

  card.innerHTML = `
    <h3>${project.title}</h3>
    <p>${project.description}</p>
  `;

  projectsGrid.appendChild(card);
});
</script>

</body>
</html>
