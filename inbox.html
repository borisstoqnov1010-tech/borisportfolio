<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <title>Inbox</title>

  <!-- 🔥 CSS връзка -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔐 LOGIN SCREEN -->
<div id="loginBox" class="loginBox">
  <h2>Admin Login</h2>

  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">Login</button>

  <p id="err"></p>
</div>

<!-- 📩 INBOX -->
<div id="inbox" style="display:none;">

  <h1>Inbox</h1>

  <!-- 🔥 TOP BUTTONS -->
  <div class="topBtns">
    
    <button onclick="goHome()" class="homeBtn">
      🏠 Home
    </button>

    <button onclick="clearMessages()" class="deleteBtn">
      Clear All
    </button>

  </div>

  <div id="list"></div>

</div>

<script>

const PASSWORD = "Borko1010"; // 🔥 твоята парола

function login(){

  let p = document.getElementById("pass").value;

  if(p === PASSWORD){

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("inbox").style.display = "block";

    loadMessages();

  } else {
    document.getElementById("err").innerText = "Грешна парола!";
  }
}

/* 🔥 HOME BUTTON */
function goHome(){
  window.location.href = "index.html";
}

/* MESSAGES */
let messages = JSON.parse(localStorage.getItem("messages")) || [];
let list = document.getElementById("list");

function save(){
  localStorage.setItem("messages", JSON.stringify(messages));
}

function loadMessages(){

  list.innerHTML = "";

  messages.forEach((m, index) => {

    let div = document.createElement("div");
    div.className = "msg";

    div.innerHTML = `
      <b>${m.name}</b> (${m.email})<br><br>
      ${m.message}<br><br>
      <small>${m.time}</small>

      <div style="margin-top:10px;">
        <button class="deleteBtn" onclick="deleteMsg(${index})">Delete</button>
        <button class="replyBtn" onclick="replyMsg(${index})">Reply</button>
      </div>

      ${m.reply ? `<div class="replyBox">Reply: ${m.reply}</div>` : ""}
    `;

    list.appendChild(div);
  });
}

function deleteMsg(i){
  messages.splice(i,1);
  save();
  loadMessages();
}

function replyMsg(i){
  let text = prompt("Напиши отговор:");
  if(text){
    messages[i].reply = text;
    save();
    loadMessages();
  }
}

function clearMessages(){
  localStorage.removeItem("messages");
  location.reload();
}

</script>

</body>
</html>
