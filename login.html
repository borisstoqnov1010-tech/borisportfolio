<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .container{
      background:white;
      width:350px;
      padding:40px;
      border-radius:15px;
      box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .input-box{
      margin-bottom:15px;
    }

    .input-box input{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4facfe;
      color:white;
      font-size:16px;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
    }

    button:hover{
      background:#00c6fb;
    }

    .switch{
      text-align:center;
      margin-top:15px;
      cursor:pointer;
      color:#4facfe;
      font-size:14px;
    }

    .message{
      text-align:center;
      margin-top:15px;
      font-size:14px;
      font-weight:bold;
    }

    .hidden{
      display:none;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginForm">
    <h2>Login</h2>

    <div class="input-box">
      <input type="text" id="loginUsername" placeholder="Username">
    </div>

    <div class="input-box">
      <input type="password" id="loginPassword" placeholder="Password">
    </div>

    <button onclick="login()">Login</button>

    <div class="switch" onclick="showRegister()">
      Нямаш акаунт? Register
    </div>
  </div>

  <!-- REGISTER -->
  <div id="registerForm" class="hidden">
    <h2>Register</h2>

    <div class="input-box">
      <input type="text" id="registerUsername" placeholder="Username">
    </div>

    <div class="input-box">
      <input type="password" id="registerPassword" placeholder="Password">
    </div>

    <button onclick="register()">Register</button>

    <div class="switch" onclick="showLogin()">
      Имаш акаунт? Login
    </div>
  </div>

  <div class="message" id="message"></div>

</div>

<script>

  // Сайт за пренасочване след login
  const redirectURL = "sandwi4smp.site";

  // Взимаме потребителите от localStorage
  let users = JSON.parse(localStorage.getItem("users")) || [];

  function register() {

    let username = document.getElementById("registerUsername").value.trim();
    let password = document.getElementById("registerPassword").value.trim();
    let message = document.getElementById("message");

    if(username === "" || password === ""){
      message.style.color = "red";
      message.innerHTML = "Попълни всички полета!";
      return;
    }

    // Проверка дали username вече съществува
    let existingUser = users.find(user => user.username === username);

    if(existingUser){
      message.style.color = "red";
      message.innerHTML = "Това име вече съществува!";
      return;
    }

    // Добавяне на нов потребител
    users.push({
      username: username,
      password: password
    });

    // Запазване
    localStorage.setItem("users", JSON.stringify(users));

    message.style.color = "green";
    message.innerHTML = "Регистрация успешна!";

    // Изчистване
    document.getElementById("registerUsername").value = "";
    document.getElementById("registerPassword").value = "";

    showLogin();
  }

  function login() {

    let username = document.getElementById("loginUsername").value.trim();
    let password = document.getElementById("loginPassword").value.trim();
    let message = document.getElementById("message");

    // Проверка за потребител
    let validUser = users.find(
      user => user.username === username && user.password === password
    );

    if(validUser){

      message.style.color = "green";
      message.innerHTML = "Успешен вход!";

      // Пренасочване
      setTimeout(() => {
        window.location.href = redirectURL;
      }, 1000);

    } else {

      message.style.color = "red";
      message.innerHTML = "Грешно име или парола!";
    }
  }

  function showRegister() {
    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("registerForm").classList.remove("hidden");
    document.getElementById("message").innerHTML = "";
  }

  function showLogin() {
    document.getElementById("registerForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("message").innerHTML = "";
  }

</script>

</body>
</html>
